# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Release pipeline (ADR-0009). Runs on tags created by release-please; locally use
# `mise run snapshot`, which skips cosign signing (keyless signing needs CI's OIDC token) and the
# container image (multi-platform buildx needs a builder with a Docker daemon).
version: 2

project_name: tfcensus

before:
  hooks:
    - go mod tidy -diff
    # License and notice files of every compiled dependency, for the archives (ADR-0012).
    - bash scripts/licenses.sh

snapshot:
  version_template: "{{ incpatch .Version }}-next"

report_sizes: true

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: tfcensus
    main: ./cmd/tfcensus
    binary: tfcensus
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/sassdavid/tfcensus/internal/buildinfo.version={{ .Version }}
      - -X github.com/sassdavid/tfcensus/internal/buildinfo.commit={{ .FullCommit }}
      - -X github.com/sassdavid/tfcensus/internal/buildinfo.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: tfcensus
    ids: [tfcensus]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      # goreleaser's ** glob needs one directory level, so the index is listed on its own.
      - third_party_licenses/THIRD_PARTY_NOTICES.md
      - third_party_licenses/**/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# cosign v3 keyless: checksums.txt.sigstore.json bundles signature + certificate.
# Verify with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity-regexp '^https://github.com/sassdavid/tfcensus/\.github/workflows/release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    output: true

# CI image with the tfcensus binary only. Users mount their own terragrunt and terraform or tofu.
dockers_v2:
  - id: tfcensus
    ids: [tfcensus]
    images:
      - ghcr.io/sassdavid/tfcensus
    tags:
      - "v{{ .Version }}"
      - '{{ if not .Prerelease }}latest{{ end }}'
    platforms:
      - linux/amd64
      - linux/arm64
    # The Dockerfile copies these to /usr/share/doc/tfcensus/ (ADR-0012).
    extra_files:
      - LICENSE
      - third_party_licenses
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: Census of Terraform/OpenTofu and Terragrunt fleets on AWS
      # A fixed URL: GitURL can end in .git, which keeps ghcr.io from linking the image to the repo.
      org.opencontainers.image.source: https://github.com/sassdavid/tfcensus
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: Apache-2.0

# release-please creates a draft release with the notes. goreleaser finds it by name,
# uploads the assets and then publishes it.
release:
  github:
    owner: sassdavid
    name: tfcensus
  name_template: "{{ .Tag }}" # release-please names the release after the tag
  use_existing_draft: true
  mode: keep-existing
  preflight:
    fail_on_error: true

changelog:
  disable: true

homebrew_casks:
  - name: tfcensus
    ids: [tfcensus]
    binaries: [tfcensus]
    repository:
      owner: sassdavid
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    skip_upload: '{{ if eq (envOrDefault "HOMEBREW_TAP_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/sassdavid/tfcensus
    description: Census of Terraform/OpenTofu and Terragrunt fleets on AWS
    license: Apache-2.0
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"
    generate_completions_from_executable:
      executable: tfcensus
      args: [completion]
      base_name: tfcensus
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    hooks:
      post:
        # The binaries aren't notarized; without this macOS Gatekeeper blocks them.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/tfcensus"]
          end

scoops:
  - name: tfcensus
    ids: [tfcensus]
    repository:
      owner: sassdavid
      name: scoop-bucket
      token: '{{ envOrDefault "SCOOP_BUCKET_TOKEN" "" }}'
    directory: bucket
    skip_upload: '{{ if eq (envOrDefault "SCOOP_BUCKET_TOKEN" "") "" }}true{{ else }}false{{ end }}'
    homepage: https://github.com/sassdavid/tfcensus
    description: Census of Terraform/OpenTofu and Terragrunt fleets on AWS
    license: Apache-2.0
    commit_msg_template: "chore(scoop): {{ .ProjectName }} {{ .Tag }}"
