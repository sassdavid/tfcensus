# Drift detection for a Terragrunt live repository: copy this file to .github/workflows/drift.yml
# there. The repo's mise.toml pins terragrunt and terraform, and its .tfcensus.yaml holds the
# drift.noise rules. sassdavid/tfcensus-action installs a verified tfcensus release.
# AWS access is a read-only role assumed with OIDC; set its ARN as the DRIFT_ROLE_ARN variable.
#
# terragrunt plans every unit once into $RUNNER_TEMP/plans. One tfcensus run in the action reads
# those plans, prints annotations, writes SARIF and Markdown, uploads the SARIF (category
# tfcensus-drift), appends the Markdown to the step summary, and gates the job last. The plans
# hold state values, so they stay on the runner and are never uploaded; the reports name attribute
# paths only. docs/ci/drift-pr.yml comments on pull requests instead.
name: drift

on:
  schedule:
    - cron: "17 5 * * 1-5"
  workflow_dispatch:

permissions: {}

concurrency:
  group: drift
  cancel-in-progress: false

jobs:
  drift:
    name: drift
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role
      security-events: write # SARIF upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: 2026.11.10
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DRIFT_ROLE_ARN }}
          aws-region: eu-west-1
      # Exit 2 means a plan has changes and 1 that a unit failed. The report records both, and
      # tfcensus turns them into findings and errors below.
      - name: terragrunt plan -refresh-only
        env:
          TG_TF_PATH: terraform
        run: |
          terragrunt run --all --tf-path terraform --json-out-dir "$RUNNER_TEMP/plans" --report-file "$RUNNER_TEMP/plans/report.json" \
            --report-format json --log-format json --no-color \
            -- plan -refresh-only -lock=false -detailed-exitcode || true
      # Exit 3: drift or a failed unit. Exit 1 or 2: tfcensus couldn't read the plans. The action
      # uploads the SARIF and writes the step summary before the step fails. It passes
      # <from>/report.json as --report-file.
      - uses: sassdavid/tfcensus-action@f2e424405b36d9a380bf64f3ae4920652decff15 # v1.2.0
        with:
          mode: report
          from: ${{ runner.temp }}/plans
          fail-on: drift,errors
