# Toolchain and tasks. Versions: docs/engineering/stack.md (Renovate keeps both in sync).

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
gofumpt = "0.12.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
goreleaser = "2.20.0"
cosign = "3.1.4"
syft = "1.57.1"
actionlint = "1.7.12"

[tasks.check]
description = "Lint, race tests and govulncheck: the single verification command"
depends = ["lint", "test", "vuln"]

[tasks.lint]
description = "All linters: Go, prose, GitHub workflows, dependency licenses and go.mod tidiness"
depends = ["lint:go", "lint:prose", "lint:actions", "lint:licenses", "lint:tidy"]

[tasks."lint:go"]
description = "golangci-lint with the golden config (ADR-0008)"
run = "golangci-lint run"

[tasks."lint:prose"]
description = "Writing rules from .claude/rules/writing.md"
run = "go run ./scripts/proselint"

[tasks."lint:actions"]
description = "actionlint on .github/workflows"
run = "actionlint"

[tasks."lint:licenses"]
description = "Fail on forbidden, restricted or unknown licenses compiled into the release binaries"
run = "bash scripts/licenses.sh -check"

[tasks."lint:tidy"]
description = "Fail when go.mod or go.sum differ from what go mod tidy would write"
run = "go mod tidy -diff"

[tasks.test]
description = "Unit, component and CLI (testscript) tests with the race detector"
run = "go test -race -count=1 ./..."

[tasks."test:emulator"]
description = "Inventory layers against moto and Floci (needs TFCENSUS_MOTO_URL and TFCENSUS_FLOCI_URL; the live workflow runs it nightly)"
run = "go test -tags emulator -count=1 -run TestSpec_inventory_5 -v ./internal/inventory/"

[tasks."test:move-e2e"]
description = "move split, apply and rollback against moto with real terraform and terragrunt (needs Docker or TFCENSUS_MOTO_URL; the live workflow runs it nightly)"
run = "mise exec terraform@1.17.1 terragrunt@1.2.1 -- go test -count=1 -run 'TestSpec_move_2$' -v ./internal/cli/"

[tasks.fuzz]
description = "Run every Go fuzz target for 60s each (mise run fuzz -- 10s sets another duration)"
run = "bash scripts/fuzz.sh"

[tasks."test:golden"]
description = "Compare golden files; pass -update to regenerate them (review the diff)"
run = "bash scripts/test-golden.sh"

[tasks.vuln]
description = "Known vulnerabilities in reachable code"
run = "govulncheck ./..."

[tasks.docs]
description = "Regenerate docs/cli; fails if the checked-in copy was stale"
run = "go run ./scripts/gendocs -out docs/cli"

[tasks."typemap:gen"]
description = "Regenerate internal/typemap/data/generated.yaml from the aws and awscc provider checkouts (TFCENSUS_PROVIDER_AWS_DIR, TFCENSUS_PROVIDER_AWSCC_DIR)"
run = "go run ./scripts/typemapgen"

[tasks."sibling:diff"]
description = "Compare the files shared with the sibling repo (.claude/rules/siblings.md)"
run = "bash scripts/sibling-diff.sh"

[tasks.snapshot]
description = "Local goreleaser build: archives, checksums, SBOMs (signing and the image only run on tags in CI)"
run = "goreleaser release --snapshot --clean --skip=sign,docker"
