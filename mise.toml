# Toolchain and tasks. Renovate updates these versions and mise.lock (engineering ADR-0015);
# docs/engineering/stack.md says why each tool is here.

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/google/go-licenses/v2" = "2.0.1"
goreleaser = "2.20.3"
syft = "1.57.2"
jactionlint = "v2.6.0"

[tasks.check]
description = "Lint, race tests and govulncheck: the single verification command"
depends = ["lint", "test", "vuln"]

[tasks.lint]
description = "All linters: Go, prose, GitHub workflows, dependency licenses and go.mod tidiness"
depends = ["lint:go", "lint:prose", "lint:actions", "lint:licenses", "lint:tidy", "lint:docs"]

[tasks."lint:go"]
description = "golangci-lint with the golden config (ADR-0008)"
run = "golangci-lint run"

[tasks."lint:prose"]
description = "Writing rules from .claude/rules/writing.md"
run = "go run ./scripts/proselint"

[tasks."lint:actions"]
description = "jactionlint on the workflows (.github/jactionlint.yaml); annotations in GitHub Actions"
run = "jactionlint ${GITHUB_ACTIONS:+--format github}"

[tasks."lint:licenses"]
description = "Fail on forbidden, restricted or unknown licenses compiled into the release binaries"
run = "bash scripts/licenses.sh -check"

[tasks."lint:docs"]
description = "oxfmt --check and oxlint on the docs site's config, scripts, theme and components (tools from mise.docs.toml)"
dir = "docs"
run = [
  "MISE_ENV=docs mise exec -- oxfmt --check '.vitepress/**/*.{mts,ts,vue,css,mjs}'",
  "MISE_ENV=docs mise exec -- oxlint --deny-warnings .vitepress",
]

[tasks."lint:tidy"]
description = "Fail when go.mod or go.sum differ from what go mod tidy would write"
run = "go mod tidy -diff"

[tasks.test]
description = "Unit, component and CLI (testscript) tests with the race detector"
run = "go test -race -count=1 ./..."

[tasks."test:emulator"]
description = "Inventory layers against moto and Floci (needs TFCENSUS_MOTO_URL and TFCENSUS_FLOCI_URL; the live workflow runs it nightly)"
run = "go test -tags emulator -count=1 -run TestSpec_inventory_5 -v ./internal/inventory/"

# The e2e tasks take terraform, tofu and terragrunt from mise.e2e.toml and mise.e2e.lock.
[tasks."test:move-e2e"]
description = "move split, apply and rollback against moto with real terraform and terragrunt (needs Docker or TFCENSUS_MOTO_URL; the live workflow runs it nightly)"
run = "MISE_ENV=e2e mise exec -- go test -count=1 -run 'TestSpec_move_2$' -v ./internal/cli/"

[tasks."test:drift-e2e"]
description = "drift in run, ingest and full mode against moto with real terragrunt, terraform and tofu (needs Docker or TFCENSUS_MOTO_URL, and the registry for the aws provider; TF_PLUGIN_CACHE_DIR keeps it; the live workflow runs it nightly)"
run = "MISE_ENV=e2e mise exec -- go test -count=1 -run 'TestSpec_drift_e2e$' -v ./internal/cli/"

[tasks."test:contract"]
description = "terragrunt contract: a raw diff against testdata/terragrunt for information, then the pinned terragrunt must read tg-live into the same units as the recordings (the live workflow runs it nightly)"
run = [
  "MISE_ENV=e2e mise exec -- bash scripts/terragrunt-contract-diff.sh tg-live",
  "MISE_ENV=e2e mise exec -- go test -tags contract -count=1 -run 'TestTerragruntContract$' -v ./internal/discovery/",
]

[tasks.fuzz]
description = "Run every Go fuzz target for 60s each (mise run fuzz -- 10s sets another duration)"
run = "bash scripts/fuzz.sh"

[tasks."test:golden"]
description = "Compare golden files; pass -update to regenerate them (review the diff)"
run = "bash scripts/test-golden.sh"

[tasks.vuln]
description = "Known vulnerabilities in reachable code"
run = "govulncheck ./..."

[tasks.docs]
description = "Regenerate the CLI and reference pages, the schema copies and the site data files; fails if a checked-in copy was stale"
run = ["go run ./scripts/gendocs", "go run ./scripts/gensite"]

# The docs:* tasks take node, aube, lychee and oxfmt from mise.docs.toml and expect
# `MISE_ENV=docs mise install` and `aube install --frozen-lockfile` in docs/ first (engineering ADR-0016).
[tasks."docs:dev"]
description = "Serve the docs site with live reload"
dir = "docs"
run = "MISE_ENV=docs mise exec -- aube exec vitepress dev ."

[tasks."docs:build"]
description = "Stale checks, llms.txt, PNG icons, the snippet check, unit tests, VitePress build with social cards, the card, third-party, docs URL and never-on-the-site checks, and the offline link check"
run = [
  "mise run docs",
  "MISE_ENV=docs mise exec -- node docs/.vitepress/llms.mts",
  "MISE_ENV=docs mise exec -- node docs/.vitepress/social.mjs",
  "go run ./scripts/gendocs -snippets",
  "MISE_ENV=docs mise exec -- node --test 'docs/.vitepress/*.test.mjs'",
  "cd docs && MISE_ENV=docs mise exec -- aube exec vitepress build .",
  "MISE_ENV=docs mise exec -- node docs/.vitepress/social-check.mjs",
  "MISE_ENV=docs mise exec -- node docs/.vitepress/third-party-check.mjs",
  "DOCS_DIST=\"$PWD/docs/.vitepress/dist\" go test -count=1 -run TestPaths ./internal/docsurl",
  "DOCS_DIST=\"$PWD/docs/.vitepress/dist\" go test -count=1 -run TestNeverOnSite ./scripts/gensite",
  "MISE_ENV=docs mise exec -- lychee --offline --include-fragments --no-progress --root-dir \"$PWD/docs/.vitepress/dist\" --fallback-extensions html --index-files index.html docs/.vitepress/dist",
]

# Needs a built site and Chrome: CHROME_PATH, or google-chrome or chromium on PATH. CI runs it on
# ubuntu-latest, which has Chrome; mise doesn't install a browser.
[tasks."docs:a11y"]
description = "axe (WCAG 2.2 AA) in both themes, the reduced-motion check and the third-party request check in headless Chrome, on the built site"
run = "MISE_ENV=docs mise exec -- node docs/.vitepress/a11y.mjs / /guides/scan /cli/audit/backend /reference/config"

[tasks."docs:preview"]
description = "Serve the built site from docs/.vitepress/dist"
dir = "docs"
run = "MISE_ENV=docs mise exec -- aube exec vitepress preview ."

[tasks."typemap:gen"]
description = "Regenerate internal/typemap/data/generated.yaml from the aws and awscc provider checkouts (TFCENSUS_PROVIDER_AWS_DIR, TFCENSUS_PROVIDER_AWSCC_DIR)"
run = "go run ./scripts/typemapgen"

[tasks."validation:stats"]
description = "Print the aggregate row of a reviewed scan CSV (verdict column fp, tp or unsure) for docs/validation"
run = "go run ./scripts/validationstats"

[tasks."sibling:diff"]
description = "Compare the files shared with the sibling repo (.claude/rules/siblings.md)"
run = "bash scripts/sibling-diff.sh"

[tasks.snapshot]
description = "Local goreleaser build: archives, checksums, SBOMs and the image in the local Docker daemon (signing only runs on tags in CI)"
run = "goreleaser release --snapshot --clean --skip=sign"
