name: live

# Nightly checks against AWS emulators (docs/plan/testing.md). No AWS account is involved.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  emulators:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      moto:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports:
          - 5000:5000
      floci:
        image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - name: inventory layers find ClickOps resources in moto and Floci
        env:
          TFCENSUS_MOTO_URL: http://localhost:5000
          TFCENSUS_FLOCI_URL: http://localhost:4566
        run: mise run test:emulator
