name: live

# Nightly checks against AWS emulators and the pinned terraform, tofu and terragrunt
# (docs/plan/testing.md). No AWS account is involved. A PR that bumps mise.e2e.toml or touches
# the recordings runs them too, before the bump merges.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - mise.e2e.toml
      - mise.e2e.lock
      - testdata/terragrunt/**
      - .github/workflows/live.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulators:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      moto:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports:
          - 5000:5000
      floci:
        image: floci/floci:2.4.0@sha256:5ee85db604c4aa74ac76e07ea5cc83086f37bb472bf3dbb97e34019e48efae9c
        ports:
          - 4566:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
      - name: inventory layers find ClickOps resources in moto and Floci
        env:
          TFCENSUS_MOTO_URL: http://localhost:5000
          TFCENSUS_FLOCI_URL: http://localhost:4566
        run: mise run test:emulator

  # L3: real terraform, tofu and terragrunt from mise.e2e.toml against one moto. The drift e2e
  # downloads the aws provider once per provider version and keeps it in the cache.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      MISE_ENV: e2e
      TFCENSUS_MOTO_URL: http://localhost:5000
    services:
      moto:
        image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          install_args: go terraform opentofu terragrunt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/tf-plugin-cache
          # The script pins the aws provider version.
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('testdata/script/spec_drift_e2e.txtar', 'mise.e2e.lock') }}
      - name: move splits a unit across two moto accounts, applies and rolls back
        run: mise run test:move-e2e
      - name: drift finds console changes in run, ingest and full mode with terraform and tofu
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tf-plugin-cache
        run: mise run test:drift-e2e

  # Risk R5: the pinned terragrunt must still write what discovery reads. The raw diff against
  # testdata/terragrunt goes to the step summary for information.
  terragrunt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      MISE_ENV: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          version: 2026.11.7
          install_args: go terraform terragrunt
      - name: the pinned terragrunt reads tg-live into the recorded units
        run: mise run test:contract
