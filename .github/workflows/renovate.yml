name: renovate

# Self-hosted Renovate, authenticated as the owner's GitHub App (sassdavid-renovate). The update
# rules are in renovate.json. Runs weekly, or by hand (Actions > renovate > Run workflow), for
# example after ticking a checkbox on the Dependency Dashboard issue. The same file is in
# both tool repos, both action repos and action-test.
on:
  schedule:
    # Mondays 01:17 UTC: inside the lock file maintenance window of config:best-practices
    # (Mondays before 04:00 UTC), with room for a delayed start, and off the hour.
    - cron: "17 1 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false # never interrupt a run halfway through pushing branches

jobs:
  renovate:
    name: renovate
    if: github.ref == 'refs/heads/main'
    # The app key is a secret of this environment, whose deployment branches are main only.
    environment: renovate
    # The action runs Renovate in a Docker container, which ubuntu-slim doesn't support.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Renovate doesn't use GITHUB_TOKEN; it clones and pushes with the app token.
    permissions: {}
    steps:
      # Installation token for this repository only. It expires after 1 hour and is revoked when
      # the job ends. The app installation must grant every permission listed here.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          permission-contents: write # branches and commits
          permission-pull-requests: write # open and update PRs
          permission-workflows: write # changes to .github/workflows/
          permission-issues: write # Dependency Dashboard issue
          permission-statuses: write # renovate/stability-days status (minimumReleaseAge)
          permission-checks: read # branch status
          permission-administration: read # branch protection
          permission-vulnerability-alerts: read # Dependabot alerts
          permission-merge-queues: read # merge queue detection
          permission-metadata: read
      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.236.2 # Renovate updates it, see renovate.json
          additional-env-list: OSV_OFFLINE_DATABASE_FORMAT
        env:
          # osvVulnerabilityAlerts downloads the OSV database on every run; split downloads only
          # the ecosystems the repository uses.
          OSV_OFFLINE_DATABASE_FORMAT: split
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_AUTODISCOVER: "false"
          # renovate.json is already there, so no onboarding PR. Without it Renovate skips the
          # repository.
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Commits through the GitHub API, signed by GitHub as the app (shows as Verified), which
          # the main ruleset requires.
          RENOVATE_PLATFORM_COMMIT: enabled
          # Lets Renovate run mise lock, so a mise.toml update also updates mise.lock.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["mise"]'
          # Branch names that can't clash with the hosted Mend Renovate app.
          RENOVATE_BRANCH_PREFIX: renovate-self-hosted/
