name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - run: mise run lint

  # The go directive is the floor (docs/engineering/version-policy.md); test that minor.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.27.3"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local # don't let a newer go.mod toolchain line upgrade the matrix version
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: go test -race
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      # The race detector needs cgo; Windows support is best effort (open question Q5).
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  # Loads the completion scripts in real shells and completes `tfcensus --format ` (engineering
  # ADR-0013): bash 5 with bash-completion, zsh, fish and nushell on ubuntu; bash 3.2 with brew
  # bash-completion v1 and zsh on macos; pwsh everywhere and Windows PowerShell 5.1.
  completion-shells:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build tfcensus onto PATH
        shell: bash
        run: |
          set -euo pipefail
          go build -o bin/ ./cmd/tfcensus
          echo "$GITHUB_WORKSPACE/bin" >>"$GITHUB_PATH"
      - name: install bash-completion, zsh and fish
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends bash-completion zsh fish
      - name: install bash-completion v1 for bash 3.2
        if: runner.os == 'macOS'
        run: brew install bash-completion
      - name: bash 5
        if: runner.os == 'Linux'
        run: bash scripts/completion-shells.sh bash
      - name: bash 3.2
        if: runner.os == 'macOS'
        env:
          BASH_BIN: /bin/bash
        run: bash scripts/completion-shells.sh bash
      - name: zsh
        if: runner.os != 'Windows'
        run: bash scripts/completion-shells.sh zsh
      - name: fish
        if: runner.os == 'Linux'
        run: bash scripts/completion-shells.sh fish
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        if: runner.os == 'Linux'
        with:
          version: 2026.11.5
          install: false
      - name: nushell through the carapace snippet
        if: runner.os == 'Linux'
        run: mise exec nushell@0.116.1 -- bash scripts/completion-shells.sh nushell
      - name: pwsh
        shell: pwsh
        run: ./scripts/completion-shells.ps1
      - name: Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/completion-shells.ps1

  # Lists the SARIF golden files that the sarif job feeds to upload-sarif.
  sarif-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: |
          set -euo pipefail
          files=$(find testdata/golden \( -name '*.sarif' -o -name '*.sarif.json' \) | sort | jq -Rsc 'split("\n")[:-1]')
          test "$files" != "[]"
          echo "files=$files" >> "$GITHUB_OUTPUT"

  # upload-sarif dry run: the action validates each file against its SARIF schema, adds
  # fingerprints and builds the upload payload. CODEQL_ACTION_TEST_MODE makes it save the payload
  # instead of uploading it, so no alert reaches code scanning.
  sarif:
    needs: sarif-goldens
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJSON(needs.sarif-goldens.outputs.files) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        env:
          CODEQL_ACTION_TEST_MODE: "true"
        with:
          sarif_file: ${{ matrix.file }}
          category: ${{ matrix.file }}

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - name: fuzz targets, 60s each
        run: mise run fuzz

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - name: docs/cli is up to date
        run: mise run docs

  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser derives the version from tags
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.5
      - run: goreleaser check
      - run: mise run snapshot
      - name: 6 archives, checksums and SBOMs
        run: |
          set -euo pipefail
          archives=$(find dist -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          sboms=$(find dist -maxdepth 1 -name '*.sbom.json' | wc -l)
          echo "archives=$archives sboms=$sboms"
          test "$archives" -eq 6
          test "$sboms" -eq 6
          (cd dist && sha256sum -c checksums.txt)
      - name: every archive carries the notices, completions and man pages
        run: |
          set -euo pipefail
          for a in dist/*.tar.gz dist/*.zip; do
            case "$a" in
              *.zip) files=$(unzip -Z1 "$a") ;;
              *) files=$(tar -tzf "$a") ;;
            esac
            for want in LICENSE third_party_licenses/THIRD_PARTY_NOTICES.md third_party_licenses/go/LICENSE \
              completions/tfcensus.bash completions/tfcensus.zsh completions/tfcensus.fish \
              completions/tfcensus.ps1 manpages/tfcensus.1.gz; do
              grep -qx "$want" <<<"$files" || { echo "$a lacks $want"; exit 1; }
            done
          done
      - name: the man pages are the same bytes on a second run
        run: |
          set -euo pipefail
          sha=$(cat manpages/* | sha256sum)
          bash scripts/completions.sh
          test "$sha" = "$(cat manpages/* | sha256sum)"
      # The snapshot loads one image per platform into the runner's Docker daemon. Releases don't
      # build it until M19, so this is the only build before then.
      - name: the container image runs
        if: hashFiles('Dockerfile') != ''
        run: |
          set -euo pipefail
          repo=ghcr.io/sassdavid/tfcensus
          docker image ls "$repo"
          for arch in amd64 arm64; do
            tag=$(docker image ls --format '{{.Tag}}' "$repo" | grep -m1 -- "-$arch\$")
            got=$(docker image inspect --format '{{.Architecture}}' "$repo:$tag")
            test "$got" = "$arch" || { echo "$repo:$tag is $got, want $arch"; exit 1; }
          done
          docker run --rm "$repo:$(docker image ls --format '{{.Tag}}' "$repo" | grep -m1 -- '-amd64$')" version
