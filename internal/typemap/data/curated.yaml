# VPC Lattice. AWS Config and Resource Explorer list only service networks; Cloud Control lists
# the rest, VPC associations once per service network. AWS creates a CHILD resource configuration
# for each resource an ARN configuration points at, so a CHILD of a managed configuration is
# derived.
- tf: aws_vpclattice_service_network
  cfn: AWS::VpcLattice::ServiceNetwork
  arn: "arn:{partition}:vpc-lattice:{region}:{account}:servicenetwork/{id}"
  id: ["{id}"]
- tf: aws_vpclattice_resource_gateway
  cfn: AWS::VpcLattice::ResourceGateway
  cc: true
  arn: "arn:{partition}:vpc-lattice:{region}:{account}:resourcegateway/{id}"
  id: ["{id}"]
- tf: aws_vpclattice_resource_configuration
  cfn: AWS::VpcLattice::ResourceConfiguration
  cc: true
  arn: "arn:{partition}:vpc-lattice:{region}:{account}:resourceconfiguration/{id}"
  id: ["{id}"]
  derived:
    parent: AWS::VpcLattice::ResourceConfiguration
    when: {resource_configuration_type: [CHILD]}
- tf: aws_vpclattice_service_network_resource_association
  cfn: AWS::VpcLattice::ServiceNetworkResourceAssociation
  cc: true
  arn: "arn:{partition}:vpc-lattice:{region}:{account}:servicenetworkresourceassociation/{id}"
  id: ["{id}"]
- tf: aws_vpclattice_service_network_vpc_association
  cfn: AWS::VpcLattice::ServiceNetworkVpcAssociation
  cc: true
  cc_parent: {type: AWS::VpcLattice::ServiceNetwork, property: ServiceNetworkIdentifier}
  arn: "arn:{partition}:vpc-lattice:{region}:{account}:servicenetworkvpcassociation/{id}"
  id: ["{id}"]

