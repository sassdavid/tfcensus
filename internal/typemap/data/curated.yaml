  arn: "arn:{partition}:memorydb:{region}:{account}:parametergroup/{name}"
  id: ["{name}"]
- tf: aws_db_parameter_group
  cfn: AWS::RDS::DBParameterGroup
  arn: "arn:{partition}:rds:{region}:{account}:pg:{name}"
  id: ["{name}"]
- tf: aws_db_option_group
  cfn: AWS::RDS::OptionGroup
  config: AWS::RDS::OptionGroup
  arn: "arn:{partition}:rds:{region}:{account}:og:{name}"
  id: ["{name}"]
- tf: aws_efs_file_system
  cfn: AWS::EFS::FileSystem
  config: AWS::EFS::FileSystem
  arn: "arn:{partition}:elasticfilesystem:{region}:{account}:file-system/{id}"
  id: ["{id}"]
- tf: aws_efs_access_point
  cfn: AWS::EFS::AccessPoint
  config: AWS::EFS::AccessPoint
  arn: "arn:{partition}:elasticfilesystem:{region}:{account}:access-point/{id}"
  id: ["{id}"]
- tf: aws_efs_mount_target
  cfn: AWS::EFS::MountTarget
  id: ["{id}"]
  unlisted: >-
    a mount target has no ARN, and neither AWS Config nor Resource Explorer lists it; its network
    interface is listed and is derived (service-eni)
- tf: aws_glue_catalog_database
  cfn: AWS::Glue::Database
  config: AWS::Glue::Database
  arn: "arn:{partition}:glue:{region}:{account}:database/{name}"
  id: ["{account}:{name}"]
- tf: aws_glue_catalog_table
  cfn: AWS::Glue::Table
  re: glue:table
  arn: "arn:{partition}:glue:{region}:{account}:table/{database_name}/{name}"
  id: ["{account}:{database_name}:{name}"]
- tf: aws_athena_workgroup
  cfn: AWS::Athena::WorkGroup
  config: AWS::Athena::WorkGroup
  arn: "arn:{partition}:athena:{region}:{account}:workgroup/{name}"
  id: ["{name}"]
- tf: aws_athena_data_catalog
  cfn: AWS::Athena::DataCatalog
  config: AWS::Athena::DataCatalog
  arn: "arn:{partition}:athena:{region}:{account}:datacatalog/{name}"
  id: ["{name}"]

# API Gateway (REST). Its ARNs have no account.
- tf: aws_api_gateway_rest_api
  cfn: AWS::ApiGateway::RestApi
  config: AWS::ApiGateway::RestApi
  re: apigateway:restapis
  arn: "arn:{partition}:apigateway:{region}::/restapis/{id}"
  id: ["{id}"]
- tf: aws_api_gateway_resource
  cfn: AWS::ApiGateway::Resource
  re: apigateway:restapis/resources
  arn: "arn:{partition}:apigateway:{region}::/restapis/{rest_api_id}/resources/{id}"
  id: ["{id}"]
  derived: {parent: AWS::ApiGateway::RestApi, state_attr: root_resource_id}
- tf: aws_api_gateway_method
  cfn: AWS::ApiGateway::Method
  config: AWS::ApiGateway::Method
  re: apigateway:restapis/resources/methods
  arn: "arn:{partition}:apigateway:{region}::/restapis/{rest_api_id}/resources/{resource_id}/methods/{http_method}"
  id: ["agm-{rest_api_id}-{resource_id}-{http_method}"]
- tf: aws_api_gateway_deployment
  cfn: AWS::ApiGateway::Deployment
  re: apigateway:restapis/deployments
  arn: "arn:{partition}:apigateway:{region}::/restapis/{rest_api_id}/deployments/{id}"
  id: ["{id}"]
- tf: aws_api_gateway_stage
  cfn: AWS::ApiGateway::Stage
  config: AWS::ApiGateway::Stage
  re: apigateway:restapis/stages
  arn: "arn:{partition}:apigateway:{region}::/restapis/{rest_api_id}/stages/{stage_name}"
  id: ["ags-{rest_api_id}-{stage_name}"]
- tf: aws_api_gateway_domain_name
  cfn: AWS::ApiGateway::DomainName
  arn: "arn:{partition}:apigateway:{region}::/domainnames/{domain_name}"
  id: ["{domain_name}"]
  unlisted: AWS Config doesn't record REST API domain names and Resource Explorer doesn't index them
- tf: aws_api_gateway_base_path_mapping
  cfn: AWS::ApiGateway::BasePathMapping
  arn: "arn:{partition}:apigateway:{region}::/domainnames/{domain_name}/basepathmappings/{base_path}"
  id: ["{domain_name}/{base_path}"]
  unlisted: AWS Config doesn't record base path mappings and Resource Explorer doesn't index them

# Systems Manager, CloudWatch, certificates and CI/CD. SSM parameter ARNs drop the name's
# leading slash, so both forms are tried.
- tf: aws_ssm_parameter
  cfn: AWS::SSM::Parameter
  arn: "arn:{partition}:ssm:{region}:{account}:parameter/{name+}"
  id: ["/{name}", "{name}"]
- tf: aws_ssm_association
  cfn: AWS::SSM::Association
  arn: "arn:{partition}:ssm:{region}:{account}:association/{association_id}"
  id: ["{association_id}"]
- tf: aws_cloudwatch_metric_alarm
  cfn: AWS::CloudWatch::Alarm
  config: AWS::CloudWatch::Alarm
  arn: "arn:{partition}:cloudwatch:{region}:{account}:alarm:{alarm_name:.+}"
  id: ["{alarm_name}"]
- tf: aws_cloudwatch_dashboard
  cfn: AWS::CloudWatch::Dashboard
  re: cloudwatch:dashboard
  global: true
  arn: "arn:{partition}:cloudwatch::{account}:dashboard/{dashboard_name+}"
  id: ["{dashboard_name}"]
- tf: aws_acm_certificate
  cfn: AWS::ACM::Certificate
  config: AWS::ACM::Certificate
  arn: "arn:{partition}:acm:{region}:{account}:certificate/{id}"
  id: ["{arn}"]
- tf: aws_codebuild_project
  cfn: AWS::CodeBuild::Project
  config: AWS::CodeBuild::Project
  arn: "arn:{partition}:codebuild:{region}:{account}:project/{name}"
  id: ["{arn}"]
- tf: aws_codepipeline
  cfn: AWS::CodePipeline::Pipeline
  config: AWS::CodePipeline::Pipeline
  arn: "arn:{partition}:codepipeline:{region}:{account}:{name}"
  id: ["{name}"]
- tf: aws_kinesisanalyticsv2_application
  cfn: AWS::KinesisAnalyticsV2::Application
  config: AWS::KinesisAnalyticsV2::Application
  arn: "arn:{partition}:kinesisanalytics:{region}:{account}:application/{name}"
  id: ["{arn}"]

